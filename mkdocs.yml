site_name: Moody-Music Documentation
site_description: Documentation
site_url: https://rixlux.github.io/Moody-Music/

repo_name: RixLux/Moody-Music
repo_url: https://github.com/RixLux/Moody-Music

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy

  palette:
    # Adds a Dark/Light mode toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode


nav:
  - Home: index.md
  - env-setup: env-setup.md
  - Installation: Installation.md
  - FAQ : FAQ.md



markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search

